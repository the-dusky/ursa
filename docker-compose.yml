version: '3.8'

services:
  # Y.js WebSocket Server
  y-websocket-server:
    build: 
      context: ./apps/server
      dockerfile: Dockerfile
    ports:
      - "${WEBSOCKET_PORT:-1234}:1234"
    environment:
      - HOST=0.0.0.0
      - PORT=1234
      - NODE_ENV=${NODE_ENV:-development}
    restart: unless-stopped
    container_name: seasonal-board-game-server
    volumes:
      # Mount for development hot reload (optional)
      - ./apps/server:/app
      - /app/node_modules
    networks:
      - game-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:1234/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Development Server (optional for full local development)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_YJS_SERVER=ws://localhost:${WEBSOCKET_PORT:-1234}
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      y-websocket-server:
        condition: service_healthy
    networks:
      - game-network
    profiles:
      - full-stack

networks:
  game-network:
    driver: bridge