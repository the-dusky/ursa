name: Deploy Y.js Server to Railway

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/server/**'
      - 'railway.toml'
      - '.github/workflows/deploy-railway.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/server/**'
  workflow_dispatch: # Allow manual trigger

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Test Y.js Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'apps/server/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/server

      - name: Run linting
        run: npm run lint || echo "No lint script found, skipping..."
        working-directory: ./apps/server

      - name: Run tests
        run: npm test || echo "No test script found, skipping..."
        working-directory: ./apps/server

      - name: Test Docker build
        run: docker build -t test-yjs-server ./apps/server

  deploy-staging:
    name: Deploy to Railway (Staging)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (Staging)
        run: railway up --service=${{ secrets.RAILWAY_STAGING_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Get deployment URL
        id: deployment
        run: |
          sleep 30
          URL=$(railway status --service=${{ secrets.RAILWAY_STAGING_SERVICE_ID }} --json | jq -r '.deployments[0].url')
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Health check
        run: |
          echo "🏥 Checking deployment health..."
          curl -f "${{ steps.deployment.outputs.url }}/health" || exit 1
          echo "✅ Staging deployment healthy!"

  deploy-production:
    name: Deploy to Railway (Production)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (Production)
        run: railway up --service=${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Get deployment URL
        id: deployment
        run: |
          sleep 45
          URL=$(railway status --service=${{ secrets.RAILWAY_SERVICE_ID }} --json | jq -r '.deployments[0].url')
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Health check
        run: |
          echo "🏥 Checking deployment health..."
          curl -f "${{ steps.deployment.outputs.url }}/health" || exit 1
          echo "✅ Production deployment healthy!"

      - name: Update environment file
        run: |
          echo "🔧 Updating remote environment configuration..."
          sed -i "s|wss://your-railway-app.railway.app|${{ steps.deployment.outputs.url }}|g" .env.remote
          echo "📝 Updated .env.remote with deployment URL: ${{ steps.deployment.outputs.url }}"

      - name: Create deployment comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ steps.deployment.outputs.url }}'
            const comment = `🚀 **Y.js Server Deployed Successfully!**
            
            📡 **WebSocket URL:** \`wss://${deploymentUrl.replace('https://', '')}\`
            🏥 **Health Check:** ${deploymentUrl}/health
            
            To use this deployment locally:
            \`\`\`bash
            node scripts/configure-env.js remote
            # Then update NEXT_PUBLIC_YJS_SERVER in .env.remote
            pnpm run dev:remote
            \`\`\`
            `
            
            if (context.payload.pull_request) {
              github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              })
            }